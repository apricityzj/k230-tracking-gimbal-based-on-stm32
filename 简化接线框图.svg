      .text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #111111; }
      .title { font-size: 34px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 500; }
      .small { font-size: 20px; font-weight: 500; }
    </style>
  </defs>

